<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Remito Editar</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>

<script type="text/javascript" src="https://code.jquery.com/jquery-1.11.3.min.js"></script>

<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.4.1/js/bootstrap-datepicker.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.4.1/css/bootstrap-datepicker3.css"/>

<script>
    $(document).ready(function(){
      var date_input=$('input[name="fecha"]'); 
      var container=$('.bootstrap-iso form').length>0 ? $('.bootstrap-iso form').parent() : "body";
      var options={
        format: 'dd/mm/yyyy',
        container: container,
        todayHighlight: true,
        autoclose: true,
      };
      date_input.datepicker(options);
    })
</script>

<body>

    <div class="starter-template">
        <h1>Remito Editar</h1>
    </div>

    <form th:action="@{/remitoEditar}" th:object="${formBean}" method="post">
        <p th:each="err : ${#fields.errors('global')}" th:text="${err}" class="error" />
        
        <table border="0" style="align-self: center;">
            <tr>
                <td><label th:text="#{remitoNumero}" /></td>
                <td><input type="text" th:field="*{id}" /></td>
                <td> <p th:if="${#fields.hasErrors('id')}" th:errorclass="error" th:errors="*{id}" /> </td>
            </tr>
            <tr>
                <td><label th:text="#{fecha}" /></td>
                <td><input type="text" id="fecha" autocomplete="off" th:field="*{fecha}" placeholder="DD/MM/YYYY" /></td>
                <td> <p th:if="${#fields.hasErrors('fecha')}" th:errorclass="error" th:errors="*{fecha}" /> </td>
            </tr>
            <tr>
    <td><label th:text="#{pallets}" /></td>
    <td>
        <select th:field="*{palletsIds}" multiple="multiple">
           <!-- <option th:each="pallet : ${allPallet}" th:value="${pallet.id}" th:text="${pallet.numero}"></option>-->
           
        </select>
    </td>
    <td> <p th:if="${#fields.hasErrors('palletsIds')}" th:errorclass="error" th:errors="*{palletsIds}" /> </td>
</tr>
        </table>
        
        <table class="botones">
            <tr>
                <td><input type="submit" name="action" value="Aceptar" /></td>
                <td><input type="submit" name="action" value="Cancelar" /></td>
            </tr>
        </table>
    </form>
</body>
</html>
